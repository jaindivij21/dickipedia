name: Data — semi-annual (full refresh)

on:
  schedule:
    - cron: '0 4 1 1,7 *'
  workflow_dispatch:

concurrency:
  group: data-semiannual
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore HTTP cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: httpcache-semiannual-${{ github.run_id }}
          restore-keys: httpcache-semiannual-

      # The engine runs every source (in dependency-safe order) and tolerates per-source failure
      # internally — throttled / WAF-guarded crawls don't sink the others. The trailing rebuild +
      # validate is the only hard gate, so a partial refresh still commits whatever succeeded.
      - name: Ingest all sources
        run: npm run ingest -- --cadence semiannual

      - name: Rebuild canonical
        run: npm run rebuild
      - name: Validate canonical
        run: npm run assert:canonical

      - name: Commit refreshed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): semi-annual full refresh [skip ci]'
          file_pattern: 'data/canonical data/raw/*.json public/parties'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_options: '--no-verify'
          push_options: '--no-verify'
