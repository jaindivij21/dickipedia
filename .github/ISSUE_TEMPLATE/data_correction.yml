name: Data correction
description: Report a wrong figure on a subject's page. A public-record source is required.
title: '[Data] <subject>: <what is wrong>'
labels: ['data-correction']
body:
  - type: markdown
    attributes:
      value: 'Thanks for improving the record. Corrections **must** cite a public source — no source, no change.'
  - type: input
    id: subject
    attributes:
      label: Subject (office-holder)
      placeholder: e.g. an MP — Narendra Modi, Varanasi
    validations:
      required: true
  - type: input
    id: field
    attributes:
      label: Which figure is wrong?
      placeholder: e.g. attendance %, declared assets, criminal cases, victory margin
    validations:
      required: true
  - type: input
    id: correct
    attributes:
      label: What is the correct value?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public-record source URL (required)
      description: ECI, PRS, Sansad, ECI affidavit, CAG, court order, gazette, etc.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / screenshot (optional)
